# ============================================================
# APPLICATION
# ============================================================
spring.application.name=Anony
spring.application.version=0.1.0

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.anony=INFO

# ============================================================
# HTTP ACCESS LOGGING
# ============================================================
server.tomcat.basedir=build
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=common

# ============================================================
# ERROR HANDLING
# ============================================================
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ============================================================
# ANONY CONFIG
# ============================================================
anony.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================================
# SECURITY & AUTHENTICATION
# ============================================================
anony.security.jwt.secret=${JWT_SECRET}
anony.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}
